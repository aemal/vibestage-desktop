<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Emoji Display</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #emoji {
            position: absolute;
            font-size: 120px;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
            user-select: none;
            pointer-events: none;
            line-height: 1;
            touch-action: manipulation;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            display: block;
        }
        
        /* Global emoji styling to ensure color emoji rendering */
        body {
            font-feature-settings: "liga", "kern";
        }
        
        /* Force color emoji for all emoji elements */
        span[style*="Apple Color Emoji"], div[style*="Apple Color Emoji"] {
            font-feature-settings: "liga", "kern";
            text-rendering: optimizeQuality;
        }
    </style>
</head>
<body>
    <div id="emoji"></div>
    <div id="calm-mode-container" style="position: fixed; left: 0; top: 0; width: 10%; height: 100%; display: flex; flex-direction: column-reverse; align-items: center; pointer-events: none;"></div>
    <div id="bottom-right-container" style="position: fixed; bottom: 0; right: 0; width: 20vw; height: 40vh; pointer-events: none; overflow: hidden;"></div>
    <!-- Removed random emoji script. Emoji will be updated by renderer.js only. -->
    <script src="renderer.js"></script>
</body>
</html>
